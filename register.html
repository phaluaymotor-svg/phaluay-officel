<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808">
<title>Register | PHALUAY MOTOR</title><link rel="icon" href="assets/phaluay-logo.webp"><link rel="stylesheet" href="styles.css">
<script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script><script defer src="firebase-config.js"></script><script defer src="firebase-init.js"></script><script defer src="sheet-config.js"></script><script defer src="sheet-sync.js"></script><script defer src="auth.js"></script>
</head><body class="auth-page red-black-theme"><div class="auth-shell">
<section class="auth-visual register-visual"><div class="auth-visual-overlay"></div><a href="login.html"><img class="auth-logo" src="assets/phaluay-logo.webp" alt="PHALUAY MOTOR"></a><div class="auth-visual-copy"><span>JOIN PHALUAY MOTOR</span><h1>YOUR EV JOURNEY<br>STARTS HERE.</h1><p>สร้างบัญชีเพื่อบันทึกรถที่สนใจ ขอราคา และติดต่อทีมขายได้สะดวกขึ้น</p></div></section>
<main class="auth-card-wrap"><div class="auth-card"><div class="auth-lang"><button data-lang="lo">ລາວ</button><button data-lang="th">ไทย</button><button data-lang="en">EN</button></div><div class="auth-mobile-logo"><img src="assets/phaluay-logo.webp"></div><span class="auth-kicker">CREATE CUSTOMER ACCOUNT</span><h2>สมัครสมาชิก</h2><p class="auth-muted">สมัครด้วย Email/Gmail หรือใช้ Google / Phone OTP</p>
<div class="auth-tabs"><button class="auth-tab active" data-panel="registerEmailPanel">EMAIL</button><button class="auth-tab" data-panel="phonePanel">PHONE OTP</button></div>
<section class="auth-panel" id="registerEmailPanel"><form id="emailRegisterForm" class="auth-form"><label>ชื่อ-นามสกุล<input name="displayName" autocomplete="name" required placeholder="ชื่อของคุณ"></label><label>Email / Gmail<input name="email" type="email" autocomplete="email" required placeholder="name@gmail.com"></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="อย่างน้อย 6 ตัวอักษร"></label><label>ยืนยันรหัสผ่าน<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></label><button class="btn btn-primary btn-full" type="submit">สร้างบัญชี</button></form><div class="auth-or"><span>หรือ</span></div><button class="google-login auth-provider-btn"><b>G</b> สมัคร / เข้าสู่ระบบด้วย Google</button></section>
<section class="auth-panel" id="phonePanel" hidden><form id="phoneForm" class="auth-form"><label>เบอร์โทรศัพท์<input name="phone" type="tel" required placeholder="+8562092224844"></label><div id="recaptcha-container"></div><button class="btn btn-primary btn-full" type="submit">ส่งรหัส OTP</button></form><form id="otpForm" class="auth-form" hidden><p>ส่ง OTP ไปที่ <b id="otpPhoneLabel"></b></p><label>รหัส OTP<input name="otp" inputmode="numeric" maxlength="6" required></label><button class="btn btn-primary btn-full" type="submit">ยืนยันและสร้างบัญชี</button></form></section>
<div id="authMessage" class="auth-message" hidden></div><p class="auth-bottom">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p></div></main></div></body></html>
